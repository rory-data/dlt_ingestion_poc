[project]
name = "jestr-teradata"
version = "0.1.0"
description = "Teradata database adapter for jestr."
requires-python = ">=3.12, <3.14"

dependencies = [
"jestr>=0.1.0",
"teradatasql>=20.0.0.40",
]

[project.entry-points."jestr.adapters"]
teradata = "jestr_teradata:TeradataAdapter"

[tool.uv.sources]
jestr = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jestr_teradata"]