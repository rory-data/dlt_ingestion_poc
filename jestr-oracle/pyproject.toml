[project]
name = "jestr-oracle"
version = "0.1.0"
description = "Oracle database adapter for jestr."
requires-python = ">=3.12, <3.14"

dependencies = [
"jestr>=0.1.0",
"oracledb>=3.4.0",
]

[project.entry-points."jestr.adapters"]
oracle = "jestr_oracle:oracleAdapter"

[tool.uv.sources]
jestr = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jestr_oracle"]