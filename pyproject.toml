[project]
name = "dlt-ingestion-poc"
version = "0.0.1"
description = "This is a project for experimentation using dlt for data ingestion in a data pipeline."
authors = [{ name = "Rory Purcell-Hewitt" }]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.11,<3.13"
classifiers = [
    "Intended Audience :: Data Engineers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "dlt[duckdb,filesystem,sql_database,workspace]>=1.9.0",
    "duckdb>=1.2.1",
    "duckdb-engine>=0.17.0",
    "ibis-framework[duckdb,polars]>=10.3",
    "pyarrow>=22.0.0",
    "loguru>=0.7.3",
    "datacontract-cli>=0.11.3",
]

[dependency-groups]
dev = [
    "hypothesis>=6.92.0",
    "memray>=1.19.1",
    "pytest>=7.2.0",
    "pytest-cookies>=0.6.1",
    "pytest-cov>=4.0.0",
    "faker>=37.1.0",
    "ruff>=0.9.2",
    "ty>=0.0.7",
    "types-pyyaml>=6.0.12.20241230",
    "prek>=0.2.25",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 88
fix = true

[tool.ruff.lint]
select = [
    "A",   # flake8-builtins
    "AIR", # Airflow
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "C90", # mccabe
    "D",   # pydocstyle
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "PT",  # flake8-pytest-style
    "RUF", # Ruff-specific rules
    "S",   # flake8-bandit
    "SIM", # flake8-simplify
    "T20", # flake8-print
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
ignore = [
    "D203", # one-blank-line-before-class (conflicts with D211)
    "D212", # multi-line-summary-first-line (conflicts with D213)
    "E501", # line-too-long
    "F403", # undefined-local-with-import-star
]
# Let unfixable automatically be ignored during ruff format
unfixable = [
    "F401", # unused-import
]

[tool.ruff.format]
quote-style = "double"  # like Black, use double quotes for strings.
indent-style = "space"  # like Black, indent with spaces.
skip-magic-trailing-comma = false  # like Black, respect magic trailing commas.
line-ending = "auto"  # like Black, automatically detect the appropriate line ending.
docstring-code-format = false
docstring-code-line-length = "dynamic"
 
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # unused import in __init__ files
"tests/*" = ["S101", "ANN", "S603"] # assert usage and type annotations in tests
"test_foo.py" = ["S101", "ANN"] # assert usage and type annotations in test_foo.py
"conftest.py" = [
    "S101",
    "ANN",
] # assert usage and type annotations in pytest config
 
[tool.ruff.lint.isort]
known-third-party = ["pytest", "requests"]
 
[tool.ruff.lint.pydocstyle]
convention = "google" # Use Google-style docstrings

[tool.ty.src]
include = [".", "ingestion", "tests"]
 
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
