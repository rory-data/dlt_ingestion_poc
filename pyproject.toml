[project]
name = "jestr"
version = "0.1.0"
description = "jestr: A library of adapters and utilitles for bullding contract-driven data Interfaces."
readme = "README.md"
authors = [{ name = "Rory Purcell-Hewitt" }]
requires-python = ">=3.12, <3.14"
classifiers = [
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "boto3>=1.42.61",
    "charset-normalizer>3.4.4",
    "dlt[duckdb, filesystem, sql_database]>=1.20",
    "duckdb>=1.5.0",
    "open-data-contract-standard>=3.1.0",
    "openlineage-python>=1.44.1",
    "orjson>=3.9.0",
    "psutil>=7.2.1",
    "pyarrow>=22.0.0",
    "pydantic-settings>=2.0.0",
    "structlog>=25.5.0",
    "tenacity>=9.1.4",
    "typer>=0.24.1",
]

[dependency-groups]
dev = [
    "jestr[all]",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "prek>=0.2.1",
    "faker>=37.1.0",
    "ruff>=0.9.2",
    "hypothesis>=6.138.11",
    "python-dotenv>=1.0.0",
    "testcontainers[postgres, oracle-free, localstack, generic]>=4.12.0",
    "memray>=1.19.1",
    "ty>=0.0.14",
    "types-pyyaml>=6.0.12.20241230",
    "pyarrow-stubs>=20.0.0.20251215",
    "jestr-oracle",
    "jestr-teradata",
    "sphinx>=8.0",
    "sphinx-rtd-theme>=3.0",
]

[project.optional-dependencies]
all = ["jestr[oracle, teradata]"]
teradata = ["jestr-teradata"]
oracle = ["jestr-oracle"]

[tool.uv.workspace]
members = ["jestr-teradata", "jestr-oracle"]

[tool.uv.sources]
jestr-teradata = { workspace = true }
jestr-oracle = { workspace = true }

[project.scripts]
bifrost = "jestr.cli:app"

# ARTEFACTS ===========

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jestr"]

[tool.uv]
index-strategy = "unsafe-best-match"

# LINTER/FORMATTER CONFIGS ==========

[tool.ruff]
target-version = "py313"
line-length = 88
fix = true

[tool.ruff.lint]
select = [
    "A",   # flake8-builtins
    "AIR", # Airflow
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "C90", # mccabe
    "D",   # pydocstyle
    "E",   # pycodestyle errors
    "F",   #pyflakes
    "I",   # işort
    "N",   # pep8-naming
    "PT",  # flake8-pytest-style
    "RUF", # Ruff-specific rules
    "S",   # Tlake8-bandit
    "SIM", # flzke8-simplify
    "T20", # flake8-print
    "UP",  # pyupgrade
    "W",   #pycodestyle warnings
]

ignore = ["D203", "D213", "E501", "F403", "TRY003"]

[tool.ruff.format]
quote-style = "double"  # like Black, use double quotes for strings.
indent-style = "space"  # like Black, indent with spaces.
skip-magic-trailing-comma = false  # like Black, respect magic trailing commas.
line-ending = "auto"  # like Black, automatically detect the appropriate line ending.
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # unused import in __init__ files
"tests/*" = ["S101", "ANN", "S603"] # assert usage and type annotations in tests
"conftest.py" = [
    "S101",
    "ANN",
] # assert usage and type annotations in pytest config

[tool.ruff.lint.isort]
known-first-party = ["jestr"]
known-third-party = ["pytest", "requests"]

[tool.ruff.lint.pydocstyle]
convention = "google" # Use Google-style docstrings

[tool.ty.src]
include = [".", "jestr", "tests"]
exclude = ["examples", "data", "docs", "sandbox", "specs"]

# TESTING CONFIGS ===========

[tool.pytest.ini_options]
minversion = "6.0"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["jestr"]

testpaths = [
"tests/unit",
"tests/integration",
"jestr-oracle/tests/unit",
"jestr-oracle/tests/integration",
"jestr-teradata/tests/unit",
"jestr-teradata/tests/integration",
]

norecursedirs = [
".*/*",
"examples",
"data",
"docs",
"sandbox",
"specs",
]

addopts = [
"--rootdir=.",
"--import-mode=importlib",
"-v",
"--strict-markers",
"--strict-config",
"--tb=short",
"--cov=jestr",
"--cov=jestr_oracle",
"--cov=jestr_teradata",
"--cov-report=term-missing",
"--cov-report=html",
"--cov-fail-under=80",
]

markers = [
"unit: marks tests as unit tests (fast, isolated)",
"integration: marks tests as integration tests (slower with dependencies)",
"serial: marks tests that cannot run in parallel",
"slow: marks tests as slow tests (require significant time or resources)",
"testcontainer: marks tests that require Docker testcontatners",
"property_based: Property-based tests using Hypothesis",
]

filterwarnings = [
"ignore::Deprecationwarning",
"ignore::PendingDeprecationwarning",
]

[tool.coverage.run]
branch = true
omit = ["tests/*", "docs/*", "scripts/*", "examples/*", "**/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "def __repr__",
    "def __str__",
]