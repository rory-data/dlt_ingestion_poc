[project]
name = "jestr"
version = "0.0.1"
description = "This is a project using dlt and Arrow for data ingestion and validation in a data pipeline."
authors = [{ name = "Rory Purcell-Hewitt" }]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.11,<3.14"
classifiers = [
    "Intended Audience :: Data Engineers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "click>=8.3.1",
    "dlt[duckdb,filesystem,sql_database,workspace]>=1.9.0",
    "duckdb>=1.2.1",
    "open-data-contract-standard>=3.1.0",
    "orjson>=3.9.0",
    "pyarrow>=22.0.0",
    "structlog>=25.5.0",
]

[dependency-groups]
dev = [
    "jestr[all]",
    "faker>=37.1.0",
    "hypothesis>=6.92.0",
    "memray>=1.19.1",
    "prek>=0.2.25",
    "pytest>=7.2.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.9.2",
    "ty>=0.0.14",
    "types-pyyaml>=6.0.12.20241230",
]

[project.optional-dependencies]
all = ["jestr[oracle, teradata, mysql]"]

oracle = ["oracledb>=3.4.0"]

teradata = ["teradatasql>=20.0.0.40"]

mysql = ["adbc-driver-manager>=1.10.0"]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"



[tool.ruff]
target-version = "py313"
line-length = 88
fix = true

[tool.ruff.lint]
select = [
    "A",   # flake8-builtins
    "AIR", # Airflow
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "C90", # mccabe
    "D",   # pydocstyle
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "PT",  # flake8-pytest-style
    "RUF", # Ruff-specific rules
    "S",   # flake8-bandit
    "SIM", # flake8-simplify
    "T20", # flake8-print
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
ignore = [
    "D203", # one-blank-line-before-class (conflicts with D211)
    "D213", # multi-line-summary-first-line (conflicts with D213)
    "E501", # line-too-long
    "F403", # undefined-local-with-import-star
    "TRY003"
]

[tool.ruff.format]
quote-style = "double"  # like Black, use double quotes for strings.
indent-style = "space"  # like Black, indent with spaces.
skip-magic-trailing-comma = false  # like Black, respect magic trailing commas.
line-ending = "auto"  # like Black, automatically detect the appropriate line ending.
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint.pydocstyle]
convention = "google"
 
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # unused import in __init__ files
"tests/*" = ["S101", "ANN", "S603"] # assert usage and type annotations in tests
"conftest.py" = [
    "S101",
    "ANN",
] # assert usage and type annotations in pytest config
 
[tool.ruff.lint.isort]
known-third-party = ["pytest", "requests"]

[tool.ty.src]
include = [".", "jestr", "tests"]

[tool.pytest.ini_options]
minversion = "6.0"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
norecursedirs = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
    ".ruff-cache",
    ".hypothesis",
]
addopts = [
    "-rootdir=.",
    "--import-mode=importlib",
    "-v",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--strict-markers",
   "--strict-config",
   "--cov-fail-under=80"
]
testpaths = [
    "tests",
]
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
 
[tool.coverage.run]
branch = true
omit = ["tests/*", "docs/*", "scripts/*", "examples/*", "**/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "def __repr__",
    "def __str__",
]
